version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: obx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: obx_economy
    ports:
      - "5432:5432"
    volumes:
      - obx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d obx_economy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  obx_pgdata:
    driver: local
